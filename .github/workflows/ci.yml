name: ci

# Two jobs, because this repository makes two different promises and both
# should be enforced rather than asserted in a README.
#
#   tests        -- the suite passes on a clean checkout.
#   reproduce    -- the deterministic headline numbers still come out the same.
#                   Every claim labelled `harness` in README.md is supposed to
#                   be a pure function of the code and a seed; if that stops
#                   being true, it should fail here and not in review.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras only — the library itself has no dependencies)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  stdlib-only:
    # The claim is "no dependencies beyond pytest". This job proves it by
    # importing and running the deterministic path with nothing installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic path must run on a bare interpreter
        run: |
          python -c "
          from skill_diplomacy.experiment.grid import TrialConfig, run_trial
          r = run_trial(TrialConfig(institution='free_trade', seed=0))
          print('mean_capability', r['mean_capability'])
          assert r['provenance']['live'] is False
          "

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Deterministic headline numbers must still reproduce
        run: python -m paper.reproduce --check
      - name: Every metric must recompute from its own shipped event log
        run: python -m paper.export_log
      - name: The committed logs must not have drifted
        run: git diff --exit-code -- runs/logs/
