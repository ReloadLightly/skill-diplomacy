<text x="72.0" y="453.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Dashed: the analytic prediction (1-d)^k, which assumes a single failure is disqualifying.</text>
<text x="72.0" y="466.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Right panel tracks it across the range. Left panel inverts below the rule&#x27;s tolerance: at d = 0.18, sixteen probes admit 100%.</text>
<text x="72.0" y="479.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Depth is not a dial on protection unless the rule is strict. Under a pass-rate rule it is a dial on variance.</text>
