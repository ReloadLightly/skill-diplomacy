<text x="88.0" y="34.0" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">self-edits screened</text>
<rect x="228.8" y="25.0" width="11" height="11" rx="2" fill="#D55E00"/>
<text x="244.8" y="34.0" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">self-edits committed unconditionally</text>
<line x1="373.7" y1="362.7" x2="373.7" y2="190.6" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="381.7" y="276.7" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="normal">gate buys +0.204  (p = 0.002)</text>
<text x="72.0" y="423.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">At perfect reliability the gate is worth exactly nothing: a competent agent never fails, so the self-improvement branch never fires.</text>
<text x="72.0" y="436.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Below it, failure triggers a rewrite that replaces a correct procedure with a worse one, and capability collapses rather than decays.</text>
<text x="72.0" y="449.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Screening your own edits is not a tax paid for safety here — it is where the capability comes from.</text>
