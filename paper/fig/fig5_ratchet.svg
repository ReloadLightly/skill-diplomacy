<text x="72" y="26" font-size="15.5" font-weight="600" fill="#1a1a1a">Ungated self-improvement destroys the knowledge it was meant to build</text>
<text x="72" y="44" font-size="11.5" fill="#6b7280">harness, autarky — no exchange, no adversary, no imports; protocol families, 8 seeds per point. Whatever happens here, the agent does to itself.</text>
