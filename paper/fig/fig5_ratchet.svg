<text x="72.0" y="453.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Left: at 97% reliability the loop costs 0.287 — every point of capability the agent was endowed with (p = 0.0002).</text>
<text x="72.0" y="466.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Right: the same loop, the same failures, the same absence of a gate costs 0.037 and is not significant (p = 0.11).</text>
<text x="72.0" y="479.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">A gate that rejects the edit recovers the left panel exactly — by being element-wise identical to not running the loop at all.</text>
