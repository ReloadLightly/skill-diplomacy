<text x="88.0" y="34.0" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">accuracy / coverage, unscreened</text>
<rect x="315.2" y="25.0" width="11" height="11" rx="2" fill="#D55E00"/>
<text x="331.2" y="34.0" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">accuracy / coverage, probes</text>
<text x="72.0" y="436.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">At 160k the unscreened arm answers everything it attempts and affords 63% of them; the screened arm affords none.</text>
<text x="72.0" y="449.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Reported as one number these read as “capability 0.627” — a state that could not pay to try, recorded as one that could not solve.</text>
