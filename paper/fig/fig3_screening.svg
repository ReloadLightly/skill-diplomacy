<rect x="344.0" y="25.0" width="11" height="11" rx="2" fill="#D55E00"/>
<text x="360.0" y="34.0" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">probes re-drawn per screening event</text>
<text x="72.0" y="406.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Home-shard regression pays 23% of the budget and admits 100%: expensive and perfectly blind.</text>
<text x="72.0" y="419.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">A fixed held-out suite has one hole and every importer falls into it at once (80% admitted); re-drawing cuts that to 29%.</text>
