<text x="72.0" y="423.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Every one of 24 fixed-suite seeds admitted either 0% or 100% — 10 misses, 14 catches, nothing between.</text>
<text x="72.0" y="436.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">The arms&#x27; MEANS are indistinguishable (p = 0.44); their spreads are not (sd 0.49 vs 0.11, ratio 4.41, p = 5e-05).</text>
<text x="72.0" y="449.0" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal">Re-drawing does not buy a lower expected contamination rate. It buys the removal of correlated, population-wide screening failure.</text>
